<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#300f0a" />
  <title>Ресурсная карта</title>
  <link rel="stylesheet" href="styles.css?v=3" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <section class="start-screen" id="startScreen">
      <button class="card-back-button" id="drawRandomCard" aria-label="Вытянуть карту">
        <img id="cardBackImage" class="card-back-image" alt="Рубашка карты" />
      </button>

      <p class="intro-text">Это колода метафорических карт для мягкого разговора с собой.
  <br><br>
  Сделай вдох, подумай о своём состоянии или вопросе и нажми на карту. Образ поможет прислушаться к себе, а послание или вопрос под картой подскажут, на что обратить внимание сегодня.
</p>

      <button class="primary-btn" id="drawRandomCardBottom">Вытянуть карту</button>
    </section>

    <section class="card-screen hidden" id="cardScreen" aria-live="polite">
      <div class="top-row">
        <button class="ghost-btn" id="backToStart">← Назад</button>
      </div>

      <article class="card-result">
        <img id="cardImage" class="card-image" alt="" />
      </article>

      <div class="actions">
        <button class="primary-btn" id="showMessage">Получить послание</button>
        <button class="secondary-btn" id="showQuestion">Получить вопрос</button>
      </div>

      <section class="reveal-box hidden" id="revealBox">
        <div class="reveal-label" id="revealLabel"></div>
        <p id="revealText"></p>
      </section>
    </section>
  </main>

  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
